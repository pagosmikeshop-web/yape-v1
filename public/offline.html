<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    >
    <meta name="theme-color" content="#742284">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <title>Sin conexión</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        color: #ffffff;
        background: linear-gradient(160deg, #35103c, #742284);
        font-family: Arial, sans-serif;
        text-align: center;
      }
      main { width: min(100%, 360px); }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: rgba(255, 255, 255, 0.86); line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Revisa tu conexión a internet y vuelve a abrir la aplicación.</p>
    </main>
  </body>
</html>
